<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Get in Touch — YES AND DESIGN STUDIO</title>

  <!-- Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css" />

  <style>
    /* Contact page specific styles */
    .contact-wrap{
      max-width: 760px;
      margin: 0 auto;
      padding-top: 40px;
    }

    .contact-intro{
      margin-bottom: 36px;
    }

    .contact-intro .lead{
      max-width: 44ch;
    }

    form{
      display:flex;
      flex-direction:column;
      gap: 26px;
    }

    label{
      display:flex;
      flex-direction:column;
      gap: 6px;
      font-size:14px;
      color: rgba(0,0,0,.6);
    }

    input,
    textarea{
      font-family: inherit;
      font-size:16px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,.18);
      outline:none;
    }

    textarea{
      min-height: 160px;
      resize: vertical;
      line-height:1.6;
    }

    input:focus,
    textarea:focus{
      border-color: rgba(0,0,0,.45);
    }

    .form-actions{
      margin-top: 10px;
    }

    button{
      font-family:inherit;
      font-size:18px;
      padding: 14px 22px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.18);
      background:#fff;
      cursor:pointer;
      width: fit-content;
    }

    button:hover{
      background: rgba(0,0,0,.04);
    }

    /* Honeypot field (hidden) */
    .hp{
      display:none;
    }
  </style>
</head>

<body data-page="contact">

  <!-- NAV -->
  <header class="nav nav--overlay" id="nav">
    <div class="nav__bar" id="navBar">
      <button class="icon-btn burger" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="menuOverlay">
        <span class="burger__line"></span>
        <span class="burger__line"></span>
        <span class="burger__line"></span>
      </button>

     <a class="brand" href="./index.html" aria-label="Go to home">
  <span class="brand__first">YES</span><span class="brand__last">AND</span>
</a>

      <a class="icon-btn linkedin" href="https://www.linkedin.com/in/jared-teiger/" target="_blank" rel="noopener">
        in
      </a>
    </div>
  </header>

  <main class="page">
    <div class="contact-wrap">

      <div class="contact-intro">
        <h1 class="h1">Get in touch</h1>
        <p class="lead">
          Whether you’re exploring a new idea, refining an existing product,
          or just want to say hello, I’d love to hear from you.
        </p>
      </div>

      <!-- FORM -->
      <form
        action="https://formspree.io/f/mqelryyj"
        method="POST"
      >

        <!-- Honeypot -->
        <input class="hp" type="text" name="company_website">

        <label>
          Name
          <input type="text" name="name" required>
        </label>

        <label>
          Company
          <input type="text" name="company">
        </label>

        <label>
          Email
          <input type="email" name="email" required>
        </label>

        <label>
          Message
          <textarea name="message" required></textarea>
        </label>

        <div class="form-actions">
          <button type="submit">Send message</button>
        </div>

      </form>
    </div>
  </main>

<!-- MENU OVERLAY (same as other pages) -->
