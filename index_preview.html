<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YES AND DESIGN</title>

<style>
  :root {
    --bg-dark: #0b0c10;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg-dark);
    font-family: Helvetica, Arial, sans-serif;
    color: white;
    overflow: hidden;
  }

  /* ---------- Background: blurred motion color ---------- */
  .background {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(60% 60% at 20% 30%, rgba(120,140,255,0.9), transparent 60%),
      radial-gradient(60% 60% at 80% 40%, rgba(255,180,90,0.8), transparent 60%),
      radial-gradient(60% 60% at 50% 75%, rgba(140,255,220,0.7), transparent 65%),
      #0b0c10;
    filter: blur(80px) saturate(140%);
    animation: drift 40s ease-in-out infinite;
    transform: scale(1.1);
  }

  @keyframes drift {
    0%   { transform: scale(1.1) translate(-2%, -1%); }
    50%  { transform: scale(1.15) translate(2%, 1%); }
    100% { transform: scale(1.1) translate(-2%, -1%); }
  }

  /* ---------- Frosted glass overlay ---------- */
  .glass-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 12, 0.45);
    backdrop-filter: blur(28px) saturate(100%);
    -webkit-backdrop-filter: blur(28px) saturate(100%);
  }

  /* ---------- Content ---------- */
  .stage {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 6vh 6vw;
    text-align: center;
  }

  .title {
    font-size: clamp(48px, 8vw, 130px);
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    position: relative;
    display: inline-block;

    /* Glass text effect */
    background: linear-gradient(
      120deg,
      rgba(255,255,255,0.85),
      rgba(180,200,255,0.85),
      rgba(255,220,180,0.85)
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    text-shadow:
      0 10px 30px rgba(0,0,0,0.35);
  }

  /* Soft glass underlay */
 .title::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(
    circle at 50% 50%,
    rgba(255,255,255,0.18),
    transparent 70%
  );
  filter: blur(28px);
  z-index: -1;
}


  .coming-soon {
    margin-top: 22px;
    font-size: clamp(12px, 1.4vw, 16px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.7;
  }

  /* Reduced motion respect */
  @media (prefers-reduced-motion: reduce) {
    .background {
      animation: none;
    }
  }
</style>
</head>

<body>
  <div class="background"></div>
  <div class="glass-overlay"></div>

  <main class="stage">
    <div>
      <div class="title">YES AND DESIGN</div>
      <div class="coming-soon">COMING SOON</div>
    </div>
  </main>
</body>
</html>
