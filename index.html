<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>YES AND DESIGN STUDIO</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0f0f0f;
    color: #ffffff;
    font-family: Helvetica, Arial, sans-serif;
  }

  .loader {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .text {
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 600;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
  }

  .static {
    margin-right: 0.4em;
    white-space: nowrap;
  }

  .slot {
    position: relative;
    height: 1.2em;
    overflow: hidden;
  }

  .slot-inner {
    display: flex;
    flex-direction: column;
    animation: scroll 14s linear infinite;
  }

  .slot-inner span {
    height: 1.2em;
    line-height: 1.2em;
    white-space: nowrap;
  }

  /* --- Color system --- */
  .design { color: #ffffff; }
  .craft { color: #d08c60; }          /* warm clay */
  .collaboration { color: #7aaedc; }  /* soft blue */
  .possibility { color: #9b7edc; }    /* violet */
  .joy { color: #f5c400; }            /* golden yellow */

  @keyframes scroll {
    from { transform: translateY(0); }
    to { transform: translateY(-6em); }
  }
</style>
</head>

<body>
  <div class="loader">
    <div class="text">
      <div class="static">YES&nbsp;AND</div>

      <div class="slot">
        <div class="slot-inner">
          <span class="design">DESIGN</span>
          <span class="craft">CRAFT</span>
          <span class="collaboration">COLLABORATION</span>
          <span class="possibility">POSSIBILITY</span>
          <span class="joy">JOY</span>
          <span class="design">DESIGN</span> <!-- seamless loop -->
        </div>
      </div>

    </div>
  </div>
</body>
</html>
