<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jared Teiger</title>
  <meta name="description" content="Jared Teiger — selected work." />

  <style>
    :root{
      --bg:#3f4347;
      --panel:#ffffff;
      --text:#111;
      --muted:#666;
      --pill:#e9eaec;
      --pillText:#1b1b1b;
      --line: rgba(0,0,0,.12);
      --shadow: 0 18px 60px rgba(0,0,0,.25);
      --radius: 28px;
      --navH: 76px;
      --maxW: 1400px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: var(--bg);
      color: #fff;
      overflow-x:hidden;
    }

    /* ====== Top Nav ====== */
    .nav{
      position: fixed;
      top:0; left:0; right:0;
      height: var(--navH);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index: 30;
      padding: 0 18px;
      pointer-events:none;
    }
    .nav-inner{
      width: min(var(--maxW), 100%);
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      pointer-events:auto;
    }
    .menu-btn{
      justify-self:start;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(0,0,0,.10);
      color:#fff;
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 700;
      letter-spacing: .02em;
      cursor:pointer;
      backdrop-filter: blur(6px);
    }
    .brand{
      justify-self:center;
      font-weight: 800;
      letter-spacing: .06em;
      font-size: 32px;
      text-transform: uppercase;
    }
    .social{
      justify-self:end;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .social a{
      width: 34px; height: 34px;
      display:grid; place-items:center;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(0,0,0,.10);
      text-decoration:none;
      color:#fff;
      backdrop-filter: blur(6px);
    }

    /* ====== Hero Slideshow ====== */
    .hero{
      height: 100vh;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding-top: var(--navH);
      position:relative;
      overflow:hidden;
    }
    .hero-frame{
      width:min(var(--maxW), 100%);
      height: calc(100vh - var(--navH));
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 20px 18px 28px;
    }
    .slideshow{
      position:relative;
      width:100%;
      height:100%;
      border-radius: 0;
      overflow:hidden;
      background:#2e3134;
    }
    .slide{
      position:absolute; inset:0;
      opacity:0;
      transition: opacity 900ms ease;
    }
    .slide.active{ opacity:1; }
    .slide img{
      width:100%;
      height:100%;
      object-fit: cover; /* fill the screen like your car image */
      display:block;
    }

    /* subtle top fade to match your screenshot vibe */
    .hero:before{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,0) 35%);
      pointer-events:none;
      z-index:2;
    }

    /* ====== Drop-down Menu Panel ====== */
    .panel{
      position: fixed;
      top: var(--navH);
      left:0; right:0;
      height: calc(100vh - var(--navH));
      background: rgba(255,255,255,0); /* animates in */
      z-index: 40;
      display:none;
    }
    .panel.open{ display:block; }
    .panel-bg{
      position:absolute; inset:0;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      animation: fadeIn 200ms ease forwards;
    }
    @keyframes fadeIn{
      from { opacity:0; }
      to   { opacity:1; }
    }
    .panel-inner{
      position:relative;
      width:min(var(--maxW), 100%);
      height:100%;
      margin:0 auto;
      padding: 26px 18px 26px;
      display:grid;
      grid-template-columns: 320px 1fr;
      gap: 26px;
      color: var(--text);
    }
    @media (max-width: 980px){
      .panel-inner{ grid-template-columns: 1fr; }
    }

    .close-row{
      position: absolute;
      top: 14px;
      left: 18px;
      z-index: 5;
    }
    .close-btn{
      border: 1px solid var(--line);
      background: #f3f3f4;
      color: #222;
      border-radius: 999px;
      padding: 9px 14px;
      font-weight: 700;
      cursor:pointer;
    }

    /* Left menu */
    .left{
      padding-top: 54px; /* leave room for close button */
    }
    .left a.big{
      display:block;
      font-size: 40px;
      line-height: 1.05;
      text-decoration:none;
      color: var(--text);
      margin: 10px 0;
      width: fit-content;
    }
    .left a.big:hover{
      text-decoration: underline;
    }
    .label{
      margin-top: 22px;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .pill-list{
      margin-top: 10px;
      display:flex;
      flex-direction: column;
      gap: 10px;
      max-width: 260px;
    }
    .pill{
      width: fit-content;
      border: 1px solid var(--line);
      background: var(--pill);
      color: var(--pillText);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 650;
      cursor: pointer;
      user-select:none;
    }
    .pill:hover{
      filter: brightness(0.98);
      outline: 2px solid rgba(0,0,0,.08);
      outline-offset: 2px;
    }

    /* Center image frame with fixed ratio */
    .center{
      padding-top: 54px; /* align with left */
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }
    .image-frame{
      width: min(760px, 100%);
      aspect-ratio: 1 / 1;       /* <- keeps same ratio always (change if you want 4/5 etc.) */
      border-radius: var(--radius);
      overflow:hidden;
      background: #ddd;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,.12);
    }
    .image-frame img{
      width:100%;
      height:100%;
      object-fit: cover;         /* keeps ratio, crops if needed */
      display:block;
      transform: scale(1.01);
    }

    /* Prevent background scroll when menu open */
    body.noscroll{ overflow:hidden; }
  </style>
</head>

<body>
  <!-- Top Nav -->
  <header class="nav" aria-label="Top Navigation">
    <div class="nav-inner">
      <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false">MENU</button>

      <div class="brand">JAREDTEIGER</div>

      <div class="social">
        <a href="https://www.linkedin.com/" target="_blank" rel="noreferrer" aria-label="LinkedIn">
          <!-- simple "in" icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6.94 8.5V20H3.5V8.5h3.44ZM5.22 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4ZM20.5 20h-3.44v-5.7c0-1.36-.03-3.1-1.9-3.1-1.9 0-2.19 1.48-2.19 3v5.8H9.53V8.5h3.3v1.57h.05c.46-.87 1.58-1.79 3.25-1.79 3.47 0 4.1 2.28 4.1 5.24V20Z" fill="currentColor"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <!-- Hero Slideshow -->
  <main class="hero">
    <div class="hero-frame">
      <section class="slideshow" aria-label="Project slideshow">
        <div class="slide active"><img src="assets/slide-1.jpg" alt="Project slide 1"></div>
        <div class="slide"><img src="assets/slide-2.jpg" alt="Project slide 2"></div>
        <div class="slide"><img src="assets/slide-3.jpg" alt="Project slide 3"></div>
      </section>
    </div>
  </main>

  <!-- Drop-down Panel -->
  <section class="panel" id="panel" aria-hidden="true">
    <div class="panel-bg"></div>

    <div class="close-row">
      <button class="close-btn" id="closeBtn" type="button">CLOSE ×</button>
    </div>

    <div class="panel-inner">
      <div class="left">
        <a class="big" href="#about">About Me</a>
        <a class="big" href="#contact">Get in Touch</a>
        <a class="big" href="#what-i-do">What I Do</a>

        <div class="label">Case Studies</div>
        <div class="pill-list" id="pillList">
          <div class="pill" data-img="assets/star-wars.jpg">Star Wars</div>
          <div class="pill" data-img="assets/the-covenant.jpg">The Covenant</div>
          <div class="pill" data-img="assets/magimates.jpg">Magimates</div>
          <div class="pill" data-img="assets/helloreal.jpg">Helloreal</div>
          <div class="pill" data-img="assets/nightflare.jpg">Nightflare</div>
          <div class="pill" data-img="assets/sapele-serenade.jpg">Sapele Serenade</div>
          <div class="pill" data-img="assets/social-queue.jpg">Social Queue</div>
        </div>
      </div>

      <div class="center">
        <div class="image-frame" aria-label="Preview image">
          <!-- Default image shown when menu opens -->
          <img id="previewImg" src="assets/slide-2.jpg" alt="Project preview">
        </div>
      </div>
    </div>
  </section>

  <script>
    // ===== Slideshow (revolving 3 images) =====
    const slides = Array.from(document.querySelectorAll(".slide"));
    let idx = 0;
    const SLIDE_MS = 3500;

    setInterval(() => {
      slides[idx].classList.remove("active");
      idx = (idx + 1) % slides.length;
      slides[idx].classList.add("active");
    }, SLIDE_MS);

    // ===== Menu panel open/close =====
    const body = document.body;
    const menuBtn = document.getElementById("menuBtn");
    const closeBtn = document.getElementById("closeBtn");
    const panel = document.getElementById("panel");
    const previewImg = document.getElementById("previewImg");

    function openPanel() {
      panel.classList.add("open");
      panel.setAttribute("aria-hidden", "false");
      menuBtn.setAttribute("aria-expanded", "true");
      body.classList.add("noscroll");

      // Always start with your 2nd slide image (as requested)
      previewImg.src = "assets/slide-2.jpg";
    }

    function closePanel() {
      panel.classList.remove("open");
      panel.setAttribute("aria-hidden", "true");
      menuBtn.setAttribute("aria-expanded", "false");
      body.classList.remove("noscroll");
    }

    menuBtn.addEventListener("click", () => {
      if (panel.classList.contains("open")) closePanel();
      else openPanel();
    });

    closeBtn.addEventListener("click", closePanel);

    // Close on ESC
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && panel.classList.contains("open")) closePanel();
    });

    // Close if user clicks outside the inner panel (on the frosted background)
    panel.addEventListener("click", (e) => {
      // only if they clicked the background layer
      if (e.target.classList.contains("panel-bg")) closePanel();
    });

    // ===== Hover to swap center image (ratio stays fixed) =====
    document.getElementById("pillList").addEventListener("mouseover", (e) => {
      const pill = e.target.closest(".pill");
      if (!pill) return;
      const img = pill.getAttribute("data-img");
      if (!img) return;
      previewImg.src = img;
    });

    // Optional: when leaving the pill list, revert to slide-2
    document.getElementById("pillList").addEventListener("mouseleave", () => {
      previewImg.src = "assets/slide-2.jpg";
    });
  </script>
</body>
</html>
