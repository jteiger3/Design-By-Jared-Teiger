<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jared Teiger</title>
  <meta name="description" content="Jared Teiger — selected work." />

  <!-- Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#3f4347;

      /* Menu + nav open state = solid white */
      --panelBg:#ffffff;

      --text:#111;
      --muted:#666;
      --pill:#e9eaec;
      --pillText:#1b1b1b;
      --line: rgba(0,0,0,.12);
      --shadow: 0 18px 60px rgba(0,0,0,.25);
      --radius: 28px;
      --navH: 76px;
      --maxW: 1400px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: Roboto, ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial;
      background: var(--bg);
      color:#fff;
      overflow-x:hidden;
    }

    /* ===== NAV ===== */
    .nav{
      position:fixed;
      top:0; left:0; right:0;
      height:var(--navH);
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 0 18px;
      pointer-events:none;

      /* default integrated look over hero */
      background: linear-gradient(to bottom, rgba(0,0,0,.28), rgba(0,0,0,0));
      backdrop-filter: blur(6px);
      transition: background 180ms ease, backdrop-filter 180ms ease;
    }
    .nav-inner{
      width: min(var(--maxW), 100%);
      display:grid;
      grid-template-columns: 56px 1fr 56px;
      align-items:center;
      pointer-events:auto;
    }

    .icon-btn{
      width:56px;
      height:56px;
      display:grid;
      place-items:center;
      background:transparent;
      border:none;
      padding:0;
      cursor:pointer;
      justify-self:start;
      -webkit-tap-highlight-color: transparent;
    }

    .burger{
      width: 22px;
      height: 16px;
      position: relative;
    }
    .burger span{
      position:absolute;
      left:0;
      width:100%;
      height:2px;
      background:#fff;
      border-radius:2px;
      transition: transform 220ms ease, top 220ms ease, opacity 180ms ease, background 180ms ease;
    }
    .burger span:nth-child(1){ top:0; }
    .burger span:nth-child(2){ top:7px; }
    .burger span:nth-child(3){ top:14px; }

    .icon-btn.open .burger span:nth-child(1){ top:7px; transform: rotate(45deg); }
    .icon-btn.open .burger span:nth-child(2){ opacity:0; }
    .icon-btn.open .burger span:nth-child(3){ top:7px; transform: rotate(-45deg); }

    .brand{
      justify-self:center;
      text-decoration:none;
      color:#fff;
      font-size: 34px;
      letter-spacing: .06em;
      text-transform: uppercase;
      user-select:none;
      transition: color 180ms ease;
      line-height:1;
      white-space:nowrap;
    }
    .brand-regular{ font-weight:400; }
    .brand-bold{ font-weight:700; margin-left:.18em; }

    .social{
      justify-self:end;
      width:56px;
      height:56px;
      display:grid;
      place-items:center;
    }
    .social a{
      width:56px; height:56px;
      display:grid; place-items:center;
      background:transparent;
      border:none;
      text-decoration:none;
      color:#fff;
      cursor:pointer;
      transition: color 180ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* NAV when menu is open: solid white (matches menu) */
    .nav.menu-open{
      background: var(--panelBg);
      backdrop-filter: none;
    }
    .nav.menu-open .brand,
    .nav.menu-open .social a{
      color:#111;
    }
    .nav.menu-open .burger span{
      background:#111;
    }

    /* ===== HERO SLIDESHOW ===== */
    .hero{
      width:100vw;
      height:100vh;
      position:relative;
      overflow:hidden;
      display:block;
    }
    .slideshow{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      background:#2e3134;
    }
    .slide{
      position:absolute;
      inset:0;
      opacity:0;
      transition: opacity 900ms ease;
    }
    .slide.active{ opacity:1; }
    .slide img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }
    .hero:before{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,0) 35%);
      pointer-events:none;
      z-index:2;
    }

    /* ===== MENU PANEL ===== */
    .panel{
      position:fixed;
      top: var(--navH);
      left:0; right:0;
      height: calc(100vh - var(--navH));
      z-index:40;
      display:none;
    }
    .panel.open{ display:block; }

    .panel-bg{
      position:absolute; inset:0;
      background: var(--panelBg);
      animation: fadeIn 180ms ease forwards;
    }
    @keyframes fadeIn{
      from{ opacity:0; }
      to{ opacity:1; }
    }

    .panel-inner{
      position:relative;
      width:min(var(--maxW), 100%);
      height:100%;
      margin:0 auto;
      padding: 22px 18px 22px;
      display:grid;
      grid-template-columns: 360px 1fr;
      gap: 26px;
      color: var(--text);
      overflow:auto;
      -webkit-overflow-scrolling: touch;
    }

    .left{ padding-top: 8px; }

    /* Top links behave like "big interactive targets" */
    .top-links{
      display:flex;
      flex-direction:column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .top-link{
      display:block;
      font-size: 42px;
      line-height: 1.05;
      text-decoration:none;
      color: var(--text);
      width: fit-content;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .top-link:hover{ text-decoration: underline; }

    .label{
      margin-top: 10px;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .pill-list{
      margin-top: 10px;
      display:flex;
      flex-direction: column;
      gap: 10px;
      max-width: 260px;
    }
    .pill{
      width: fit-content;
      border: 1px solid var(--line);
      background: var(--pill);
      color: var(--pillText);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 650;
      cursor: pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

    .center{
      padding-top: 8px;
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }
    .image-frame{
      width: min(760px, 100%);
      aspect-ratio: 1 / 1;
      border-radius: var(--radius);
      overflow:hidden;
      background:#ddd;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,.12);
    }
    .image-frame img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      transform: scale(1.01);
      transition: opacity 160ms ease;
    }

    body.noscroll{ overflow:hidden; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 980px){
      .panel-inner{
        grid-template-columns: 1fr;
        gap: 18px;
      }
      .pill-list{
        max-width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 10px;
      }
      .center{ justify-content:flex-start; }
      .image-frame{ width: 100%; max-width: 760px; }
    }

    @media (max-width: 560px){
      :root{ --navH: 64px; }
      .nav{ padding: 0 12px; }
      .nav-inner{ grid-template-columns: 48px 1fr 48px; }

      .icon-btn, .social, .social a{
        width:48px; height:48px;
      }

      .burger{ width:20px; height:14px; }
      .burger span:nth-child(2){ top:6px; }
      .burger span:nth-child(3){ top:12px; }
      .icon-btn.open .burger span:nth-child(1){ top:6px; }
      .icon-btn.open .burger span:nth-child(3){ top:6px; }

      .brand{
        font-size: 22px;
        letter-spacing: .05em;
      }

      .top-link{ font-size: 34px; }

      .image-frame{
        aspect-ratio: 4 / 5;
        border-radius: 22px;
      }
    }
  </style>
</head>

<body>
  <!-- NAV -->
  <header class="nav" aria-label="Top Navigation">
    <div class="nav-inner">
      <button class="icon-btn" id="menuBtn" type="button" aria-expanded="false" aria-label="Open menu">
        <div class="burger" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </button>

      <a class="brand" href="#" id="homeLink" aria-label="Home">
        <span class="brand-regular">JARED</span><span class="brand-bold">TEIGER</span>
      </a>

      <div class="social">
        <a href="https://www.linkedin.com/in/jared-teiger/" target="_blank" rel="noreferrer" aria-label="LinkedIn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6.94 8.5V20H3.5V8.5h3.44ZM5.22 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4ZM20.5 20h-3.44v-5.7c0-1.36-.03-3.1-1.9-3.1-1.9 0-2.19 1.48-2.19 3v5.8H9.53V8.5h3.3v1.57h.05c.46-.87 1.58-1.79 3.25-1.79 3.47 0 4.1 2.28 4.1 5.24V20Z" fill="currentColor"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <!-- HERO / SLIDESHOW -->
  <main class="hero" id="top">
    <section class="slideshow" aria-label="Project slideshow">
      <div class="slide active"><img src="assets/slide-1.jpg" alt="Project slide 1"></div>
      <div class="slide"><img src="assets/slide-2.jpg" alt="Project slide 2"></div>
      <div class="slide"><img src="assets/slide-3.jpg" alt="Project slide 3"></div>
    </section>
  </main>

  <!-- MENU PANEL -->
  <section class="panel" id="panel" aria-hidden="true">
    <div class="panel-bg"></div>

    <div class="panel-inner">
      <div class="left">
        <!-- These now update the SAME right preview square -->
        <div class="top-links" id="topLinks">
          <a class="top-link" href="#about" data-preview="assets/about.jpg">About Me</a>
          <a class="top-link" href="#what-i-do" data-preview="assets/what-i-do.jpg">What I Do</a>
          <a class="top-link" href="#contact" data-preview="assets/get-in-touch.jpg">Get in Touch</a>
        </div>

        <div class="label">Case Studies</div>
        <div class="pill-list" id="pillList">
          <div class="pill" data-preview="assets/star-wars.jpg" role="button" tabindex="0">Star Wars</div>
          <div class="pill" data-preview="assets/the-covenant.jpg" role="button" tabindex="0">The Covenant</div>
          <div class="pill" data-preview="assets/magimates.jpg" role="button" tabindex="0">Magimates</div>
          <div class="pill" data-preview="assets/helloreal.jpg" role="button" tabindex="0">Helloreal</div>
          <div class="pill" data-preview="assets/nightflare.jpg" role="button" tabindex="0">Nightflare</div>
          <div class="pill" data-preview="assets/sapele-serenade.jpg" role="button" tabindex="0">Sapele Serenade</div>
          <div class="pill" data-preview="assets/social-queue.jpg" role="button" tabindex="0">Social Queue</div>
        </div>
      </div>

      <div class="center">
        <div class="image-frame" aria-label="Preview">
          <img id="previewImg" src="assets/slide-2.jpg" alt="Preview">
        </div>
      </div>
    </div>
  </section>

  <script>
    // ===== Slideshow =====
    const slides = Array.from(document.querySelectorAll(".slide"));
    let idx = 0;
    const SLIDE_MS = 3500;

    setInterval(() => {
      slides[idx].classList.remove("active");
      idx = (idx + 1) % slides.length;
      slides[idx].classList.add("active");
    }, SLIDE_MS);

    // ===== Menu open/close =====
    const body = document.body;
    const nav = document.querySelector(".nav");
    const menuBtn = document.getElementById("menuBtn");
    const panel = document.getElementById("panel");
    const homeLink = document.getElementById("homeLink");

    const previewImg = document.getElementById("previewImg");
    const topLinks = document.getElementById("topLinks");
    const pillList = document.getElementById("pillList");

    const DEFAULT_PREVIEW = "assets/slide-2.jpg";

    function setPreview(src){
      if (!src) return;
      // tiny crossfade feel
      previewImg.style.opacity = "0.15";
      const next = new Image();
      next.onload = () => {
        previewImg.src = src;
        previewImg.style.opacity = "1";
      };
      next.onerror = () => {
        previewImg.style.opacity = "1";
        console.warn("Preview image failed to load:", src);
      };
      next.src = src;
    }

    function openPanel() {
      panel.classList.add("open");
      panel.setAttribute("aria-hidden", "false");
      nav.classList.add("menu-open");

      menuBtn.setAttribute("aria-expanded", "true");
      menuBtn.setAttribute("aria-label", "Close menu");
      menuBtn.classList.add("open");

      body.classList.add("noscroll");

      // default right preview when menu opens
      setPreview(DEFAULT_PREVIEW);
    }

    function closePanel() {
      panel.classList.remove("open");
      panel.setAttribute("aria-hidden", "true");
      nav.classList.remove("menu-open");

      menuBtn.setAttribute("aria-expanded", "false");
      menuBtn.setAttribute("aria-label", "Open menu");
      menuBtn.classList.remove("open");

      body.classList.remove("noscroll");
    }

    menuBtn.addEventListener("click", () => {
      if (panel.classList.contains("open")) closePanel();
      else openPanel();
    });

    homeLink.addEventListener("click", (e) => {
      e.preventDefault();
      closePanel();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && panel.classList.contains("open")) closePanel();
    });

    panel.addEventListener("click", (e) => {
      if (e.target.classList.contains("panel-bg")) closePanel();
    });

    // ===== Unified preview behavior (top links + pills) =====
    function attachPreviewHandlers(container){
      // Desktop hover
      container.addEventListener("mouseover", (e) => {
        if (!window.matchMedia("(hover: hover)").matches) return;
        const el = e.target.closest("[data-preview]");
        if (!el) return;
        setPreview(el.getAttribute("data-preview"));
      });

      // Mobile / click
      container.addEventListener("click", (e) => {
        const el = e.target.closest("[data-preview]");
        if (!el) return;
        setPreview(el.getAttribute("data-preview"));
      });

      // Keyboard (Enter/Space)
      container.addEventListener("keydown", (e) => {
        if (e.key !== "Enter" && e.key !== " ") return;
        const el = e.target.closest("[data-preview]");
        if (!el) return;
        e.preventDefault();
        setPreview(el.getAttribute("data-preview"));
      });
    }

    attachPreviewHandlers(topLinks);
    attachPreviewHandlers(pillList);

    // Optional: revert preview when leaving the left column on desktop
    // (comment out if you want the last hovered item to "stick")
    const leftColumn = document.querySelector(".left");
    leftColumn.addEventListener("mouseleave", () => {
      if (!window.matchMedia("(hover: hover)").matches) return;
      setPreview(DEFAULT_PREVIEW);
    });

    // Debug image load failures (open console)
    document.querySelectorAll("img").forEach(img => {
      img.addEventListener("error", () => console.warn("Image failed to load:", img.getAttribute("src")));
    });
  </script>
</body>
</html>
